[pytest]
testpaths = tests
addopts = -ra
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s %(message)s
markers =
    llm: tests requiring a real LLM endpoint
    mcp: tests validating real MCP server discovery and tool execution
    skill: tests validating Skill routing
    local: tests using Filesystem or LocalShell
