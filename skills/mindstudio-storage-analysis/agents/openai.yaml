interface:
  display_name: "MindStudio Storage Analysis"
  short_description: "Diagnose Ascend local and GlusterFS storage bottlenecks"
  default_prompt: "Use $mindstudio-storage-analysis to diagnose whether local disk or GlusterFS FUSE Host IO is causing an Ascend workload slowdown; if the workload PID or data path is unknown, run bounded read-only target discovery first and ask me only when candidates remain ambiguous. Preserve NFS and other network filesystems as auxiliary evidence paths. Return a concise terminal diagnosis and, when the filesystem is writable, an offline HTML report generated from the original artifacts and Agent summary JSON."
