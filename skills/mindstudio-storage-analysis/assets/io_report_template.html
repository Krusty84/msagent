<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="mindstudio-storage-analysis/render_io_report.py">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
  <title>$report_title</title>
  <style>
    /* === THEME: OFFLINE TERMINAL REPORT === */
    :root {
      --bg: #07100d;
      --surface: #0b1712;
      --surface-2: #0e1d17;
      --surface-3: #13251d;
      --line: #234337;
      --line-strong: #356652;
      --ink: #edf8f1;
      --muted: #9ab8aa;
      --dim: #668577;
      --mint: #61e0b2;
      --acid: #c7ff33;
      --cyan: #5dd8ff;
      --yellow: #ffd166;
      --orange: #ff9e64;
      --red: #ff6b78;
      --radius: 14px;
      --shadow: 0 18px 60px rgba(0, 0, 0, .24);
      --sans: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    /* === BASE AND PAGE ATMOSPHERE === */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 82% 8%, rgba(97, 224, 178, .10), transparent 27rem),
        radial-gradient(circle at 4% 36%, rgba(199, 255, 51, .05), transparent 24rem),
        linear-gradient(rgba(97, 224, 178, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(97, 224, 178, .035) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, 52px 52px, 52px 52px, auto;
      font-family: var(--sans);
      line-height: 1.55;
    }
    a { color: inherit; }
    code, .mono { font-family: var(--mono); }
    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; }

    /* === STICKY REPORT NAVIGATION === */
    .report-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(53, 102, 82, .78);
      background: rgba(7, 16, 13, .90);
      backdrop-filter: blur(18px);
    }
    .nav-inner {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font: 700 13px var(--mono); letter-spacing: .08em; color: var(--mint); }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acid); box-shadow: 0 0 18px rgba(199, 255, 51, .72); }
    .nav-links { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a { flex: none; padding: 8px 11px; border: 1px solid transparent; border-radius: 8px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .nav-links a:hover, .nav-links a:focus-visible { color: var(--acid); border-color: var(--line); outline: none; }

    /* === HERO AND DIAGNOSIS SNAPSHOT === */
    .hero { padding: 76px 0 34px; }
    .eyebrow { margin-bottom: 14px; color: var(--acid); font: 700 13px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 1050px; margin: 0; font-size: clamp(40px, 6vw, 82px); line-height: 1.06; letter-spacing: -.045em; }
    .hero-summary { max-width: 1000px; margin: 24px 0 0; color: var(--muted); font-size: clamp(18px, 2vw, 25px); }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .meta-chip { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(11, 23, 18, .72); color: var(--muted); font: 600 13px var(--mono); }
    .meta-chip strong { color: var(--ink); }
    .hero-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 42px; }
    .metric-card { min-height: 132px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(14, 29, 23, .94), rgba(8, 18, 14, .92)); box-shadow: var(--shadow); }
    .metric-label { color: var(--dim); font: 600 12px var(--mono); letter-spacing: .08em; }
    .metric-value { margin-top: 13px; color: var(--ink); font-size: 29px; font-weight: 800; line-height: 1.15; word-break: break-word; }
    .metric-foot { margin-top: 10px; color: var(--muted); font-size: 13px; }

    /* === REPORT SECTIONS === */
    .report-section { padding: 46px 0 10px; scroll-margin-top: 70px; }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    .section-title-wrap { display: flex; gap: 14px; }
    .section-icon { width: 42px; height: 42px; display: grid; place-items: center; flex: none; border: 1px solid var(--line-strong); border-radius: 11px; background: rgba(14, 29, 23, .9); color: var(--mint); }
    .section-icon svg { width: 22px; height: 22px; }
    h2 { margin: 0; font-size: clamp(27px, 3vw, 40px); line-height: 1.15; letter-spacing: -.025em; }
    .section-subtitle { max-width: 900px; margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(11, 23, 18, .92); box-shadow: var(--shadow); }
    .panel-body { padding: 22px; }
    .empty { padding: 28px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); background: rgba(8, 18, 14, .55); }

    /* === PIPELINE AND ARTIFACT STATUS === */
    .pipeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .pipeline-card { position: relative; min-height: 150px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: rgba(8, 18, 14, .86); }
    .pipeline-card::after { content: "→"; position: absolute; top: 55px; right: -12px; z-index: 2; color: var(--acid); font: 700 18px var(--mono); }
    .pipeline-card:last-child::after { display: none; }
    .pipeline-step { color: var(--mint); font: 700 11px var(--mono); letter-spacing: .08em; }
    .pipeline-card h3 { margin: 14px 0 8px; font: 700 15px/1.35 var(--mono); word-break: break-word; }
    .pipeline-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .pipeline-state { display: inline-flex; margin-top: 12px; padding: 4px 8px; border-radius: 999px; font: 700 11px var(--mono); }

    /* === AGENT INTERPRETATION === */
    .agent-focus { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, .7fr); gap: 16px; align-items: stretch; }
    .agent-reading { padding: 30px 32px; border: 1px solid var(--line-strong); border-top: 4px solid var(--acid); border-radius: var(--radius); background: rgba(11, 23, 18, .96); box-shadow: var(--shadow); }
    .agent-kicker, .boundary-label, .recommendation-heading span { color: var(--acid); font: 800 12px var(--mono); letter-spacing: .08em; }
    .agent-reading > h3 { max-width: 42em; margin: 12px 0 0; font-size: 26px; line-height: 1.45; letter-spacing: 0; }
    .agent-context { max-width: 70em; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; line-height: 1.75; }
    .agent-evidence { margin-top: 26px; }
    .agent-evidence h4, .agent-boundaries h4 { margin: 0 0 12px; color: var(--ink); font-size: 15px; }
    .agent-evidence ol { display: grid; gap: 11px; margin: 0; padding-left: 26px; }
    .agent-evidence li { padding-left: 5px; color: var(--muted); font-size: 16px; line-height: 1.75; }
    .agent-evidence li::marker { color: var(--mint); font: 800 13px var(--mono); }
    .agent-synthesis { margin-top: 24px; padding: 18px 20px; border-left: 3px solid var(--mint); background: rgba(97, 224, 178, .07); }
    .agent-synthesis strong { color: var(--mint); font-size: 13px; }
    .agent-synthesis p { margin: 7px 0 0; color: var(--ink); font-size: 16px; line-height: 1.7; }
    .agent-boundaries { padding: 25px; border: 1px solid rgba(255, 209, 102, .42); border-radius: var(--radius); background: rgba(50, 39, 12, .28); }
    .agent-boundaries .boundary-label { color: var(--yellow); }
    .agent-boundaries > p { margin: 12px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .agent-boundaries > ul { margin: 0; padding-left: 19px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .agent-boundaries li + li { margin-top: 9px; }
    .recommendation-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 30px 0 13px; }
    .recommendation-heading h3 { margin: 5px 0 0; font-size: 22px; }
    .recommendation-heading p { max-width: 460px; margin: 0; color: var(--muted); font-size: 14px; text-align: right; }
    .recommendation-list { display: grid; gap: 11px; }
    .recommendation { display: grid; grid-template-columns: 70px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--line); border-left: 4px solid var(--mint); border-radius: 10px; background: rgba(8, 18, 14, .86); }
    .recommendation.priority-high { border-left-color: var(--red); }
    .recommendation.priority-medium { border-left-color: var(--orange); }
    .recommendation.priority-low { border-left-color: var(--cyan); }
    .recommendation-index { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-right: 1px solid var(--line); background: rgba(19, 37, 29, .5); }
    .recommendation-index span { color: var(--dim); font: 700 11px var(--mono); }
    .recommendation-index strong { color: var(--ink); font: 800 17px var(--mono); }
    .recommendation-content { padding: 20px 22px; }
    .recommendation h3 { margin: 0; font-size: 18px; line-height: 1.45; }
    .recommendation p { max-width: 78em; margin: 9px 0 0; color: var(--muted); font-size: 15px; line-height: 1.75; white-space: pre-wrap; }
    .recommendation-meta { justify-content: flex-start; margin-top: 13px; }

    /* === FINDINGS === */
    .finding-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .finding-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(11, 23, 18, .92); }
    .finding-card.severity-high { border-color: rgba(255, 107, 120, .55); }
    .finding-card.severity-medium { border-color: rgba(255, 158, 100, .48); }
    .finding-head { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: rgba(14, 29, 23, .82); }
    .rule-title { display: flex; align-items: center; gap: 12px; }
    .rule-id { color: var(--acid); font: 800 18px var(--mono); }
    .rule-name { font-weight: 750; }
    .badge-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .badge { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; font: 700 11px var(--mono); }
    .finding-body { padding: 20px; }
    .finding-summary { margin: 0; font-size: 17px; }
    .finding-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
    .mini-block { padding: 14px; border-radius: 9px; background: rgba(19, 37, 29, .66); }
    .mini-block h4 { margin: 0 0 8px; color: var(--dim); font: 700 11px var(--mono); letter-spacing: .08em; }
    .mini-block ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .mini-block li + li { margin-top: 5px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .data-tag { padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: rgba(7, 16, 13, .65); font: 600 11px var(--mono); word-break: break-all; }

    /* === TABLES AND DATA BARS === */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--dim); background: rgba(19, 37, 29, .62); font: 700 11px var(--mono); letter-spacing: .06em; }
    td { color: var(--muted); font-size: 13px; }
    td strong { color: var(--ink); }
    tbody tr:hover { background: rgba(97, 224, 178, .035); }
    .bar-track { width: 120px; height: 7px; overflow: hidden; border-radius: 999px; background: #172b22; }
    .bar-fill { height: 100%; width: var(--bar-width); max-width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--acid)); }
    .data-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .data-grid > * { min-width: 0; }
    .data-grid .wide { grid-column: 1 / -1; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .panel-title h3 { margin: 0; font-size: 18px; }
    .panel-title span { color: var(--dim); font: 600 11px var(--mono); }

    /* === DISCOVERY, QUALITY, AND TRACEABILITY === */
    .candidate-list { display: grid; gap: 12px; }
    .candidate { padding: 18px; border: 1px solid var(--line); border-radius: 11px; background: rgba(8, 18, 14, .72); }
    .candidate-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .candidate h3 { margin: 0; font: 700 17px var(--mono); }
    .candidate p { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .path-list { display: grid; gap: 7px; margin-top: 13px; }
    .path-item { display: flex; justify-content: space-between; gap: 16px; padding: 9px 11px; border-radius: 7px; background: rgba(19, 37, 29, .62); color: var(--muted); font-size: 12px; }
    .provider-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .provider { padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: rgba(8, 18, 14, .66); }
    .provider-name { font: 700 12px var(--mono); word-break: break-word; }
    .provider-note { margin-top: 7px; color: var(--dim); font-size: 12px; }
    .artifact-list { display: grid; gap: 9px; }
    .artifact { display: grid; grid-template-columns: 160px minmax(180px, 1fr) 110px; gap: 14px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 9px; background: rgba(8, 18, 14, .66); }
    .artifact code { color: var(--muted); font-size: 11px; word-break: break-all; }

    /* === STATUS COLORS === */
    .state-ok, .status-ok, .severity-info, .confidence-high { color: var(--mint); border-color: rgba(97, 224, 178, .38); background: rgba(97, 224, 178, .09); }
    .state-skipped, .status-unsupported, .status-empty, .confidence-none { color: var(--dim); border-color: var(--line); background: rgba(102, 133, 119, .08); }
    .state-review, .status-partial, .severity-low, .confidence-medium { color: var(--yellow); border-color: rgba(255, 209, 102, .38); background: rgba(255, 209, 102, .08); }
    .status-missing, .status-permission_denied, .status-command_failed, .status-parse_failed, .severity-high { color: var(--red); border-color: rgba(255, 107, 120, .40); background: rgba(255, 107, 120, .08); }
    .severity-medium, .confidence-low { color: var(--orange); border-color: rgba(255, 158, 100, .40); background: rgba(255, 158, 100, .08); }

    /* === FOOTER, RESPONSIVE, AND PRINT === */
    footer { margin-top: 58px; padding: 24px 0 54px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
    @media (max-width: 1060px) {
      .hero-grid, .provider-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pipeline-card:nth-child(3)::after { display: none; }
      .finding-grid, .agent-focus, .data-grid { grid-template-columns: 1fr; }
      .data-grid .wide { grid-column: auto; }
    }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1440px); }
      .nav-inner { align-items: flex-start; flex-direction: column; gap: 6px; padding: 10px 0; }
      .nav-links { width: 100%; gap: 2px; justify-content: space-between; }
      .nav-links a { padding: 6px 4px; font-size: 12px; }
      .hero { padding-top: 44px; }
      .hero-grid, .provider-grid, .pipeline, .finding-columns { grid-template-columns: 1fr; }
      .pipeline-card::after { display: none; }
      .artifact { grid-template-columns: 1fr; }
      .section-heading, .candidate-head { flex-direction: column; }
      .metric-value { font-size: 24px; }
      .agent-reading { padding: 24px 20px; }
      .agent-reading > h3 { font-size: 22px; }
      .recommendation-heading { align-items: flex-start; flex-direction: column; }
      .recommendation-heading p { text-align: left; }
      .recommendation { grid-template-columns: 54px minmax(0, 1fr); }
      .recommendation-content { padding: 18px 16px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print {
      :root { --bg: #fff; --surface: #fff; --surface-2: #fff; --surface-3: #f5f8f6; --line: #cfd9d3; --line-strong: #aabdb3; --ink: #132019; --muted: #40564b; --dim: #61766b; }
      body { background: #fff; color: var(--ink); }
      .report-nav { display: none; }
      .hero { padding-top: 24px; }
      .panel, .metric-card, .finding-card { box-shadow: none; break-inside: avoid; }
      .report-section { break-before: auto; }
      a { text-decoration: none; }
    }
  </style>
</head>
<body>
  <nav class="report-nav" aria-label="报告章节">
    <div class="shell nav-inner">
      <div class="brand"><span class="brand-dot"></span>MINDSTUDIO / IO REPORT</div>
      <div class="nav-links">
        <a href="#overview">概览</a>
        <a href="#agent">Agent 总结</a>
        <a href="#findings">规则结论</a>
        <a href="#metrics">关键指标</a>
        <a href="#quality">证据质量</a>
      </div>
    </div>
  </nav>
  $report_body
  <footer>
    <div class="shell">生成时间：$generated_at · 本文件完全自包含，可离线打开。报告可能包含主机名、PID 和数据路径，对外分享前请确认脱敏范围。</div>
  </footer>
</body>
</html>
